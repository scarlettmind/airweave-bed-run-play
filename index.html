<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>airweave</title>
<link rel="stylesheet" href="style.css">
<script src="game.js?v=2" defer></script>
</head>
<body>
<main aria-label="相机跳跃游戏">
  <video id="camera" playsinline muted hidden></video>
  <canvas id="scene" width="900" height="600" tabindex="0" aria-label="点按或按空格开始与跳跃"></canvas>
  <img id="logo" src="airweave.png" alt="airweave">
  <output id="score" aria-label="得分">0000</output>
  <button id="toggle" aria-label="切换相机或演示" hidden><span aria-hidden="true"></span></button>
  <button id="share" aria-label="分享到 Instagram" hidden>分享到 Instagram</button>
  <p id="status" class="sr" role="status"></p>
</main>
</body>
</html>
